<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1400" />
<title>{{PROYECTO}} — Mockup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1400px;
    height: 900px;
    overflow: hidden;
    background: #111111;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f0ece6;
    position: relative;
  }

  /* ── Fondo decorativo ── */
  .bg-pattern {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 60px,
        rgba(180,20,20,0.03) 60px,
        rgba(180,20,20,0.03) 61px
      );
    pointer-events: none;
    z-index: 0;
  }

  .bg-glow-left {
    position: absolute;
    left: -120px; top: -120px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,20,20,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .bg-glow-right {
    position: absolute;
    right: -100px; bottom: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,20,20,0.09) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Layout principal ── */
  .layout {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 900px;
  }

  /* ── Panel izquierdo ── */
  .sidebar {
    background: #0d0d0d;
    border-right: 1px solid #2a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 36px;
    position: relative;
    overflow: hidden;
  }

  .sidebar::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(to bottom, transparent, #c0151f, transparent);
  }

  /* ornamento chino SVG inline */
  .ornament {
    width: 64px;
    height: 64px;
    margin-bottom: 32px;
  }

  .label-tag {
    display: inline-block;
    background: rgba(192,21,31,0.15);
    border: 1px solid rgba(192,21,31,0.4);
    color: #e05050;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
  }

  .project-name {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #ffffff;
    line-height: 1.15;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .project-name span {
    color: #c0151f;
  }

  .divider-line {
    width: 48px;
    height: 2px;
    background: #c0151f;
    margin-bottom: 20px;
  }

  .subtitle {
    font-size: 13px;
    color: #888;
    line-height: 1.8;
    margin-bottom: 40px;
  }

  /* stats */
  .stats {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .stat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c0151f;
    flex-shrink: 0;
  }

  .stat-text {
    font-size: 11px;
    color: #666;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stat-val {
    font-size: 11px;
    color: #999;
    margin-left: auto;
  }

  /* footer sidebar */
  .sidebar-footer {
    border-top: 1px solid #1e1e1e;
    padding-top: 24px;
  }

  .tema-badge {
    font-size: 10px;
    color: #444;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .fecha {
    font-size: 11px;
    color: #555;
  }

  /* ── Panel derecho: screenshots ── */
  .main {
    display: grid;
    grid-template-rows: 1fr 1fr;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    padding: 32px 32px 32px 28px;
    gap: 16px;
  }

  /* Screenshot grande (arriba, ocupa 2 columnas) */
  .shot-hero {
    grid-column: 1 / -1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #2a0a0a;
    position: relative;
    background: #1a1a1a;
  }

  /* Barra de navegador falsa */
  .browser-bar {
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .dot-r { width:10px; height:10px; border-radius:50%; background:#c0151f; }
  .dot-y { width:10px; height:10px; border-radius:50%; background:#555; }
  .dot-g { width:10px; height:10px; border-radius:50%; background:#333; }

  .url-bar {
    flex: 1;
    background: #111;
    border-radius: 4px;
    height: 22px;
    margin: 0 12px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
  }

  .url-dot { width: 6px; height: 6px; border-radius: 50%; background: #3a3; flex-shrink: 0; }
  .url-text { font-size: 10px; color: #555; letter-spacing: 0.5px; }

  .shot-hero .browser-bar { }

  .shot-img-hero {
    width: 100%;
    height: calc(100% - 40px);
    object-fit: cover;
    object-position: top;
    display: block;
  }

  /* Screenshots pequeños (abajo) */
  .shot-small {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #2a0a0a;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
  }

  .shot-small .browser-bar { }

  .shot-img-small {
    width: 100%;
    flex: 1;
    object-fit: cover;
    object-position: top;
    display: block;
  }

  /* etiqueta de sección en shots */
  .shot-label {
    position: absolute;
    bottom: 10px;
    right: 12px;
    background: rgba(192,21,31,0.85);
    color: #fff;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 10px;
  }
</style>
</head>
<body>

<div class="bg-pattern"></div>
<div class="bg-glow-left"></div>
<div class="bg-glow-right"></div>

<div class="layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">

    <!-- Ornamento chino -->
    <svg class="ornament" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="62" height="62" rx="4" stroke="#c0151f" stroke-width="1"/>
      <rect x="8" y="8" width="48" height="48" rx="2" stroke="#c0151f" stroke-width="0.5" stroke-dasharray="4 3"/>
      <line x1="32" y1="8" x2="32" y2="56" stroke="#c0151f" stroke-width="0.5"/>
      <line x1="8" y1="32" x2="56" y2="32" stroke="#c0151f" stroke-width="0.5"/>
      <circle cx="32" cy="32" r="8" stroke="#c0151f" stroke-width="1"/>
      <circle cx="32" cy="32" r="3" fill="#c0151f"/>
      <rect x="29" y="29" width="6" height="6" stroke="#c0151f" stroke-width="0.5" transform="rotate(45 32 32)"/>
    </svg>

    <div>
      <div class="label-tag">{{ETIQUETA}}</div>
      <div class="project-name">{{PROYECTO}}</div>
      <div class="divider-line"></div>
      <div class="subtitle">{{SUBTITULO}}</div>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-dot"></div>
          <div class="stat-text">Diseño Web</div>
          <div class="stat-val">HTML / CSS</div>
        </div>
        <div class="stat-item">
          <div class="stat-dot"></div>
          <div class="stat-text">Interfaz</div>
          <div class="stat-val">Responsive</div>
        </div>
        <div class="stat-item">
          <div class="stat-dot"></div>
          <div class="stat-text">Estilo</div>
          <div class="stat-val">Dark · Elegante</div>
        </div>
        <div class="stat-item">
          <div class="stat-dot"></div>
          <div class="stat-text">Secciones</div>
          <div class="stat-val">Menú · Galería · Reservas</div>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="tema-badge">{{TEMA_NOMBRE}}</div>
      <div class="fecha">{{FECHA}}</div>
    </div>

  </aside>

  <!-- ── MAIN: SCREENSHOTS ── -->
  <main class="main">

    <!-- Screenshot grande -->
    <div class="shot-hero" style="position:relative;">
      <div class="browser-bar">
        <div class="dot-r"></div>
        <div class="dot-y"></div>
        <div class="dot-g"></div>
        <div class="url-bar">
          <div class="url-dot"></div>
          <div class="url-text">tanwan.com</div>
        </div>
      </div>
      <img class="shot-img-hero" src="{{IMG_1}}" alt="screenshot hero" />
      <div class="shot-label">Vista principal</div>
    </div>

    <!-- Screenshot 2 -->
    <div class="shot-small" style="position:relative;">
      <div class="browser-bar">
        <div class="dot-r"></div>
        <div class="dot-y"></div>
        <div class="dot-g"></div>
        <div class="url-bar">
          <div class="url-dot"></div>
          <div class="url-text">tanwan.com/menu</div>
        </div>
      </div>
      <img class="shot-img-small" src="{{IMG_2}}" alt="screenshot 2" />
      <div class="shot-label">Menú</div>
    </div>

    <!-- Screenshot 3 -->
    <div class="shot-small" style="position:relative;">
      <div class="browser-bar">
        <div class="dot-r"></div>
        <div class="dot-y"></div>
        <div class="dot-g"></div>
        <div class="url-bar">
          <div class="url-dot"></div>
          <div class="url-text">tanwan.com/reservacion</div>
        </div>
      </div>
      <img class="shot-img-small" src="{{IMG_3}}" alt="screenshot 3" />
      <div class="shot-label">Reservación</div>
    </div>

  </main>

</div>
</body>
</html>
